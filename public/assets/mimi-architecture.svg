<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
<title id="title">Mimi browser architecture</title>
<desc id="description">Firebase Hosting serves the React application. The browser uses Supabase Auth for Google Workspace sign-in and reads protected PostgreSQL records. Shared Zod schemas validate records in the browser.</desc>
