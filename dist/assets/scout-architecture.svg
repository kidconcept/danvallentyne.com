<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title description">
  <title id="title">How Scout turns sources into shared findings</title>
  <desc id="description">Configured webpages and Bluesky feeds enter a model-assisted reader. Saved findings in PostgreSQL are shared by the website, Slack notifications and a private calendar subscription.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#809598"/></marker>
  </defs>
  <rect width="1120" height="680" fill="#f5f4ef"/>
  <g fill="none" stroke="#809598" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 122 V 150 H 560 V 182"/>
    <path d="M 800 122 V 150 H 560 V 182"/>
    <path d="M 560 292 V 342"/>
    <path d="M 560 452 V 487 H 200 V 530"/>
    <path d="M 560 452 V 530"/>
    <path d="M 560 452 V 487 H 920 V 530"/>
  </g>
  <g stroke="#ced5cf" stroke-width="2" fill="#fffefa">
    <rect x="120" y="42" width="400" height="80" rx="6"/>
    <rect x="600" y="42" width="400" height="80" rx="6"/>
    <rect x="260" y="182" width="600" height="110" rx="6"/>
    <rect x="40" y="530" width="320" height="110" rx="6"/>
    <rect x="400" y="530" width="320" height="110" rx="6"/>
    <rect x="760" y="530" width="320" height="110" rx="6"/>
  </g>
  <rect x="260" y="342" width="600" height="110" rx="6" fill="#092e53"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#172f34">
    <text x="320" y="91" font-size="26">Configured webpages</text>
    <text x="800" y="91" font-size="26">Bluesky author feeds</text>
    <text x="560" y="227" font-size="27">Investigate and extract</text>
    <text x="560" y="264" font-size="20" fill="#53676a">Model-assisted reading of each source</text>
    <text x="560" y="387" font-size="27" fill="#fffefa">Shared findings</text>
    <text x="560" y="424" font-size="20" fill="#fffefa">Descriptions, priorities, dates and source links</text>
    <text x="200" y="575" font-size="26">Website</text>
    <text x="200" y="612" font-size="19" fill="#53676a">Search and source details</text>
    <text x="560" y="575" font-size="26">Slack</text>
    <text x="560" y="612" font-size="19" fill="#53676a">High-priority notifications</text>
    <text x="920" y="575" font-size="26">Calendar</text>
    <text x="920" y="612" font-size="19" fill="#53676a">Private event subscription</text>
  </g>
</svg>
