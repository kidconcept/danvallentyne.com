<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="title description">
  <title id="title">Network Graph authoring and public application architecture</title>
  <desc id="description">Local records are edited through an Express Record API backed by PostgreSQL. A public export removes private review data and supplies a static browser application built with React, Zustand and Three.js.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#092e53"/></marker></defs>
  <rect width="600" height="720" fill="#f5f4ef"/>
  <g fill="#fffefa" stroke="#aebfc5" stroke-width="1.5">
    <rect x="32" y="24" width="536" height="150" rx="14"/>
    <rect x="32" y="250" width="536" height="150" rx="14"/>
    <rect x="32" y="476" width="536" height="150" rx="14"/>
  </g>
  <g stroke="#092e53" stroke-width="2" marker-end="url(#arrow)"><path d="M300 184 V232"/><path d="M300 410 V458"/></g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#092e53" font-size="28">
      <text x="300" y="70">Local authoring</text>
      <text x="300" y="296">Public export</text>
      <text x="300" y="522">Browser exploration</text>
    </g>
    <g fill="#53676a" font-size="22">
      <text x="300" y="111">Express Record API</text>
      <text x="300" y="143">PostgreSQL graph</text>
      <text x="300" y="337">JSON snapshot + gallery assets</text>
      <text x="300" y="369">Private review data removed</text>
      <text x="300" y="563">React • Zustand • Three.js</text>
      <text x="300" y="595">Graph, catalogue and profiles</text>
    </g>
    <text x="300" y="682" fill="#53676a" font-size="19">Firebase Hosting serves the public application</text>
  </g>
</svg>
